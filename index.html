<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fox Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header, scrolling main area, bottom navigation. Sheets slide up from the bottom. */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#efebe6; --fg:#17130f; --muted:#6f685f; --line:#e6e0d9;
  --accent:#e8640c; --accent-ink:#ffffff; --accent-soft:#fde6d4;
  --green:#14a37f; --green-soft:#d9f2ea; --brand:#111114; --good:#178a5a; --good-soft:#dcf3e6; --bad:#d0342c; --bad-soft:#fbe3e1;
  --shadow:rgba(40,24,10,.14);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
    --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
    --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
    --shadow:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
  --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
  --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
  --shadow:rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.head{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font:800 25px/1.05 var(--font-display);letter-spacing:-.02em}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.brand small span{color:var(--accent);font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--surface2)}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
h2{font:700 22px/1.2 var(--font-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}

/* Bausteine */
.box{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.grn{background:var(--green);color:#fff}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg.i{width:18px;height:18px}
select,input[type=text],input[type=password],textarea{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg)}
select{height:46px;padding:0 12px;font-weight:600}
textarea{min-height:84px;resize:none;font-size:18px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.add{border-style:dashed;color:var(--muted)}

.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:64px;height:64px}

/* Navigation unten */
.bnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.bnav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.bnav button[aria-current="page"]{color:var(--fg)}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.bnav .badge{position:absolute;margin:-16px 0 0 24px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Blatt von unten */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{font:700 21px/1.2 var(--font-display);margin:0}
.srow{background:var(--surface);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.srow.line{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.srow small{color:var(--muted);font-size:13.5px}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-logo{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:var(--brand);box-shadow:0 14px 34px var(--shadow);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-logo svg{width:74px;height:74px}
#splash b{font:800 32px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:8px;animation:spUp .5s .15s ease both}
#splash small{font-size:14px;color:var(--muted);letter-spacing:.06em;animation:spUp .5s .3s ease both}
#splash small span{color:var(--accent);font-weight:700}
@keyframes spPop{from{transform:scale(.6);opacity:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Fox Loader */
/* ===== Fox Center ===== */
.logo,#splash .sp-logo{box-shadow:inset 0 0 0 1px var(--line)}
.clock{text-align:right;line-height:1.1;flex:none}
.clock b{display:block;font:800 22px/1 var(--font-display);letter-spacing:-.01em}
.clock small{font-size:11.5px;color:var(--muted)}
.view{max-width:1400px}
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sech h2{margin:0;font-size:19px}
.sech .btn{flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:0;border-radius:18px;padding:14px 10px 12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);box-shadow:0 1px 0 var(--line);position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;inset:auto -20% -60% -20%;height:90%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.tile .ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.tile .ti svg.i{width:26px;height:26px}
.tile b{font:700 15px/1.1 var(--font-display)}
.tile small{color:var(--muted);font-size:12px;margin-top:-3px}
.rowx{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px;scroll-padding:16px}
.rowx::-webkit-scrollbar{display:none}
.rowx>.card{width:220px;flex:none}
.rowx>.card.sqc{width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid.sq{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.grid.pics{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
.card{border:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;color:var(--fg);box-shadow:0 1px 0 var(--line);transition:transform .15s}
.card .th{position:relative;aspect-ratio:16/9;background:var(--surface2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.card.sqc .th,.grid.sq .card .th{aspect-ratio:1/1}
.card .th svg.i{width:34px;height:34px;opacity:.5}
.card .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.card .th img.ok{opacity:1}
.card .th .dur{position:absolute;right:6px;bottom:7px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:6px}
.card .th .seen{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.card .th .seen svg.i{width:15px;height:15px;opacity:1;stroke-width:3}
.card .th .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.card .th .bar i{display:block;height:100%;background:var(--accent)}
.card .cap{padding:8px 10px 10px;display:flex;flex-direction:column;min-width:0}
.card .cap b{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cap small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{border:0;padding:0;aspect-ratio:1/1;background:var(--surface2);border-radius:6px;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s;display:block}
.pic img.ok{opacity:1}
.list{display:flex;flex-direction:column;gap:6px}
.li{border:0;background:var(--surface);border-radius:14px;padding:9px 10px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--fg);width:100%;min-height:58px}
.li .lt{width:46px;height:46px;border-radius:10px;background:var(--surface2);flex:none;display:grid;place-items:center;color:var(--muted);overflow:hidden;position:relative}
.li .lt.wide{width:96px;height:54px}
.li .lt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.li .lt img.ok{opacity:1}
.li .lt.logo2 img{object-fit:contain;padding:4px;background:#fff}
.li .lt b{font:800 15px var(--font-display);color:var(--muted)}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.li .tx b{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx .bar{height:3px;border-radius:2px;background:var(--surface2);margin-top:5px;overflow:hidden}
.li .tx .bar i{display:block;height:100%;background:var(--accent)}
.li .end{flex:none;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.li.on{box-shadow:inset 0 0 0 2px var(--accent)}
.li.on .tx b{color:var(--accent)}
.li .ok2{color:var(--green)}
.ib.sm2{width:40px;height:40px}
.ib.star.on{color:#e8a10c}
.ib.star.on svg{fill:#e8a10c}
.pgh{display:flex;align-items:center;gap:6px;margin:-4px 0 0}
.pgh h2{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero2{position:relative;border-radius:20px;overflow:hidden;background:var(--surface2);aspect-ratio:16/7;max-height:300px}
.hero2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.hero2 img.ok{opacity:1}
.hero2::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78))}
.hero2 .ht{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;color:#fff}
.hero2 .ht b{font:800 22px/1.15 var(--font-display);display:block}
.hero2 .ht small{opacity:.85;font-size:13px}
.plot{font-size:14.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.meta span.st{color:#e8a10c}
.note{background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note b{font-size:15.5px}
.note small{color:var(--fg);opacity:.8;font-size:14px}
.search{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:14px;padding:0 6px 0 12px}
.search input{background:transparent!important;padding:12px 4px!important}
.scan{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}

/* Mini-Player */
.mini{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px 8px 12px}
.mini .mc{width:44px;height:44px;border-radius:10px;background:var(--surface2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative}
.mini .mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini .mt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;color:var(--fg)}
.mini .mt b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mt small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mp{position:absolute;left:0;right:0;top:-1px;height:2px}
.mini .mp i{display:block;height:100%;background:var(--accent)}
.mini{position:relative}
.np{display:flex;flex-direction:column;align-items:center;gap:12px}
.np .cv{width:min(72vw,300px);aspect-ratio:1/1;border-radius:22px;background:var(--surface2);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted);box-shadow:0 14px 34px var(--shadow)}
.np .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.np .cv svg.i{width:80px;height:80px}
.np .nt{text-align:center}
.np .nt b{font:800 20px/1.2 var(--font-display);display:block}
.np .nt small{color:var(--muted)}
.np .tl{display:flex;justify-content:space-between;width:100%;font-size:12.5px;color:var(--muted);margin-top:-6px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl .ib{width:52px;height:52px}
.ctl .ib.on{color:var(--accent)}
.ctl .big{width:70px;height:70px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center}
.ctl .big svg.i{width:32px;height:32px}

body:has(#mini:not([hidden])) .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{min-height:52px;font-size:15.5px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.quick .btn svg.i{width:20px;height:20px;color:var(--accent)}
/* Bildbetrachter */
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vt{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 18px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;transition:opacity .25s}
.viewer .vt b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.viewer .ib{color:#fff}
.viewer .nv{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);border:0;color:#fff;display:grid;place-items:center}
.viewer .nv.l{left:12px}.viewer .nv.r{right:12px}
.viewer.idle .vt,.viewer.idle .nv{opacity:0}

/* Fernbedienung / Tastatur */
body.kb :focus{outline:3px solid var(--accent);outline-offset:2px}
body.kb .card:focus,body.kb .tile:focus,body.kb .pic:focus{transform:scale(1.04);outline-offset:0}

/* Breiter Bildschirm / Fernseher: Navigation links wie im Kodi-Hauptmenue */
@media (min-width:900px){
  body{display:grid;grid-template-columns:110px 1fr;grid-template-rows:auto 1fr auto auto}
  .head{grid-column:2;padding:18px 28px 6px}
  main{grid-column:2;padding:6px 28px 28px}
  .mini{grid-column:2}
  .bnav{grid-column:1;grid-row:1/5;grid-template-columns:1fr!important;grid-auto-rows:min-content;align-content:center;gap:6px;border-top:0;border-right:1px solid var(--line);padding:16px 8px}
  .bnav button{padding:10px 0;font-size:13px}
  .bnav button .pill{width:64px;height:40px;border-radius:14px}
  .tiles{grid-template-columns:repeat(6,1fr)}
  .rowx{margin:0 -28px;padding:4px 28px 10px;scroll-padding:28px}
  .rowx>.card{width:300px}
  .rowx>.card.sqc{width:190px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .grid.sq{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .grid.pics{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

<script>
'use strict';
/* ================= Grundlagen ================= */
var REPO='__REPO__';
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>';}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function isNative(){try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}}
function plug(name){
  if(!isNative())return null;
  try{return (Capacitor.Plugins&&Capacitor.Plugins[name])||Capacitor.registerPlugin(name);}catch(e){return null;}
}
async function fetchT(url,opt,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},ms||15000);
  try{return await fetch(url,Object.assign({signal:ctl.signal},opt||{}));}finally{clearTimeout(t);}
}
function errText(e){return String((e&&e.message)||e||'Unbekannter Fehler');}
function hms(s){s=Math.max(0,Math.round(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x;}
function mb(b){if(!b)return '';return b<1048576?Math.max(1,Math.round(b/1024))+' KB':b<1073741824?(b/1048576).toFixed(0)+' MB':(b/1073741824).toFixed(1).replace('.',',')+' GB';}
function pad(n){return (n<10?'0':'')+n;}
function fsrc(u){if(!u)return '';if(/^(content|file):/.test(u)||u.charAt(0)==='/'){try{return Capacitor.convertFileSrc(u);}catch(e){return u;}}return u;}
var tT;function toast(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on');},ms||3800);}
var C=plug('Center');

var set=Object.assign({theme:'dark',tmdb:'',minMovie:40,autoUpd:true,sort:'new',deep:false,engine:'auto'},load('fc-set',{}));
var repos=load('fc-repos',[]);       // {id,url,name,kind,t,tv:[ids],src:[ids]}
var deepOk=false,deepInfo=load('fc-deepinfo',null);
function applyTheme(){if(set.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',set.theme);}
function saveSet(){save('fc-set',set);applyTheme();}
applyTheme();
var resume=load('fc-resume',{});     // Schlüssel -> {pos,dur,t,title,sub,th,img,play}
var watched=load('fc-watched',{});   // Schlüssel -> 1
var favs=load('fc-favs',[]);         // {k,type,title,sub,th,img}
var sources=load('fc-src',[]);       // {id,name,type:'dlna'|'webdav'|'http',url,user,pass,ctl}
var tvLists=load('fc-tv',[]);        // {id,name,url,ua,count,t}
var tvFav=load('fc-tvfav',[]);       // Kanal-URLs
function saveRes(){var ks=Object.keys(resume).sort(function(a,b){return resume[b].t-resume[a].t;});ks.slice(60).forEach(function(k){delete resume[k];});save('fc-resume',resume);}

/* ================= Kleiner Speicher (IndexedDB) für große Listen ================= */
var _db;
function idb(){if(_db)return _db;_db=new Promise(function(res,rej){var r=indexedDB.open('foxcenter',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return _db;}
async function iget(k){try{var db=await idb();return await new Promise(function(res){var q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){res(undefined);};});}catch(e){return undefined;}}
async function iset(k,v){try{var db=await idb();await new Promise(function(res){var t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}}
async function idel(k){try{var db=await idb();await new Promise(function(res){var t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

/* ================= Netz (in der App ohne CORS-Sperren) ================= */
async function req(url,o){
  o=o||{};
  if(C){var r=await C.req({url:url,method:o.method||'GET',headers:o.headers||{},body:o.body==null?null:o.body,timeout:o.timeout||20000});return {status:r.status,text:r.text||'',url:r.url||url};}
  var x=await fetchT(url,{method:o.method||'GET',headers:o.headers||{},body:o.body==null?undefined:o.body},o.timeout||20000);
  return {status:x.status,text:await x.text(),url:x.url||url};
}
async function getJSON(url,h){var r=await req(url,{headers:Object.assign({'Accept':'application/json'},h||{})});if(r.status>=400)throw new Error('Fehler '+r.status);return JSON.parse(r.text);}

/* ================= Mediathek ================= */
var lib={video:[],audio:[],image:[]},perm={video:true,audio:true,image:true},scanning=false,libLoaded=false;
var V={movies:[],shows:[],showMap:{},folders:[],byUri:{}},M={albums:[],artists:[],folders:[],byUri:{}},P={buckets:[]};
var TAGS=/\b(2160p|1080p|720p|576p|480p|4k|uhd|hdr|hdr10|x264|x265|h264|h265|hevc|avc|web[- ]?dl|webrip|web|bluray|blu[- ]?ray|bdrip|brrip|dvdrip|dvd|hdtv|german|deutsch|english|eng|ger|dl|ac3|dts|aac|ddp?5[ .]?1|multi|remux|proper|repack|extended|uncut|xvid|divx)\b/i;
function tidy(s){return String(s||'').replace(/[\[\](){}]/g,' ').replace(/^[\s\-]+|[\s\-]+$/g,'').replace(/\s+/g,' ').trim();}
function cleanName(n){return String(n||'').replace(/\.[a-z0-9]{2,4}$/i,'').replace(/[._]+/g,' ').replace(/\s+/g,' ').trim();}
function cutTags(t){var k=t.search(TAGS);return k>0?t.slice(0,k):t;}
function parseVid(name){
  var n=cleanName(name);
  var m=n.match(/^(.*?)[\s\-\[(]*[Ss](\d{1,2})\s*[Ee](\d{1,3})(.*)$/)||n.match(/^(.*?)[\s\-]+(\d{1,2})x(\d{2})\b(.*)$/);
  if(m&&tidy(m[1])){var show=tidy(m[1].replace(/\b(19|20)\d{2}\s*$/,''))||tidy(m[1]);return {ep:true,show:show,s:+m[2],e:+m[3],et:tidy(cutTags(m[4]||'')).replace(/^-\s*/,'')};}
  var y=n.match(/^(.*?)[\s(\[]+((?:19|20)\d{2})(?:[\s)\]]|$)/);
  var t=tidy(cutTags(y?y[1]:n));
  return {ep:false,title:t||n,year:y?+y[2]:0};
}
function vTitle(v){var p=v.p;return p.ep?p.show:p.title;}
function vSub(v){var p=v.p;if(p.ep)return 'S'+pad(p.s)+'E'+pad(p.e)+(p.et?' · '+p.et:'');return [p.year||'',v.dur?hms(v.dur/1000):''].filter(Boolean).join(' · ');}
function folderName(f){f=String(f||'').replace(/\/+$/,'');var k=f.lastIndexOf('/');return k>=0?f.slice(k+1):f||'Speicher';}

function processLib(){
  // Videos
  V={movies:[],shows:[],showMap:{},folders:[],byUri:{}};
  var fm={};
  lib.video.forEach(function(v){
    v.p=parseVid(v.name||v.title);V.byUri[v.uri]=v;
    var f=v.folder||'';(fm[f]=fm[f]||[]).push(v);
    if(v.p.ep){var k=v.p.show.toLowerCase();var s=V.showMap[k];if(!s){s=V.showMap[k]={k:k,name:v.p.show,eps:[],date:0};V.shows.push(s);}s.eps.push(v);s.date=Math.max(s.date,v.date||0);}
    else if((v.dur||0)>=set.minMovie*60000||/(^|\/)(movies?|filme?|kino)(\/|$)/i.test(v.folder||''))V.movies.push(v);
  });
  V.shows.forEach(function(s){s.eps.sort(function(a,b){return a.p.s-b.p.s||a.p.e-b.p.e;});});
  V.folders=Object.keys(fm).map(function(f){return {f:f,name:folderName(f),items:fm[f]};}).sort(function(a,b){return a.name.localeCompare(b.name,'de');});
  // Musik
  M={albums:[],artists:[],folders:[],byUri:{}};
  var am={},rm={},mf={};
  lib.audio.forEach(function(t){
    t.title=t.title||cleanName(t.name);t.art=t.uri;t.artist=(t.artist&&t.artist!=='<unknown>')?t.artist:'Unbekannt';t.album=t.album||folderName(t.folder);
    M.byUri[t.uri]=t;
    var ak=String(t.albumId||t.album);var a=am[ak];if(!a){a=am[ak]={k:ak,name:t.album,artist:t.artist,tracks:[],art:t.uri};M.albums.push(a);}a.tracks.push(t);
    var r=rm[t.artist.toLowerCase()];if(!r){r=rm[t.artist.toLowerCase()]={name:t.artist,tracks:[],art:t.uri};M.artists.push(r);}r.tracks.push(t);
    (mf[t.folder||'']=mf[t.folder||'']||[]).push(t);
  });
  M.albums.forEach(function(a){a.tracks.sort(function(x,y){return (x.track%1000)-(y.track%1000)||x.title.localeCompare(y.title,'de');});if(a.tracks.some(function(t){return t.artist!==a.artist;}))a.artist='Verschiedene';});
  M.albums.sort(function(a,b){return a.name.localeCompare(b.name,'de');});
  M.artists.sort(function(a,b){return a.name.localeCompare(b.name,'de');});
  M.folders=Object.keys(mf).map(function(f){return {f:f,name:folderName(f),items:mf[f]};}).sort(function(a,b){return a.name.localeCompare(b.name,'de');});
  // Bilder
  var bm={};lib.image.forEach(function(i){var b=i.bucket||folderName(i.folder);(bm[b]=bm[b]||[]).push(i);});
  P={buckets:Object.keys(bm).map(function(b){return {name:b,items:bm[b]};}).sort(function(a,b){return b.items.length-a.items.length;})};
}
async function loadLibCache(){
  for(var k of ['video','audio','image']){var x=await iget('lib-'+k);if(Array.isArray(x))lib[k]=x;}
  processLib();libLoaded=true;
}
async function checkPerm(){if(!C)return perm;try{perm=await C.perm();}catch(e){}return perm;}
function anyPerm(){return perm.video||perm.audio||perm.image;}
async function checkDeep(){if(!C)return false;try{deepOk=!!(await C.allFiles()).granted;}catch(e){deepOk=false;}return deepOk;}
async function scanAll(quiet){
  if(!C||scanning)return;
  await checkPerm();
  if(set.deep)await checkDeep();
  var deep=set.deep&&deepOk;
  if(!anyPerm()&&!deep){render();return;}
  scanning=true;render();
  try{
    for(var k of ['video','audio','image']){
      lib[k]=[];
      if(!perm[k])continue;
      var r=await C.scan({kind:k});lib[k]=(r&&r.items)||[];
    }
    if(deep){
      // ganzes Geraet: alles dazu, was Android nicht in der Mediathek hat
      var w=await C.walk(),known={},added=0;
      ['video','audio','image'].forEach(function(k){lib[k].forEach(function(x){if(x.path)known[x.path]=1;});});
      ((w&&w.items)||[]).forEach(function(x,i){if(known[x.path])return;known[x.path]=1;x.id='f'+i;x.deep=true;lib[x.kind].push(x);added++;});
      lib.video.sort(function(a,b){return (b.date||0)-(a.date||0);});
      deepInfo={t:Date.now(),checked:(w&&w.checked)||0,added:added};save('fc-deepinfo',deepInfo);
    }
    for(var k2 of ['video','audio','image'])await iset('lib-'+k2,lib[k2]);
    processLib();
    if(!quiet)toast((deep?'Ganzes Handy durchsucht: ':'Mediathek aktualisiert: ')+lib.video.length+' Videos, '+lib.audio.length+' Lieder, '+lib.image.length+' Bilder');
  }catch(e){toast('Einlesen fehlgeschlagen: '+errText(e));}
  scanning=false;render();
}
async function askPerm(){
  if(!C){toast('Das geht nur in der App.');return;}
  try{await C.askPerm();}catch(e){}
  var n=0,iv=setInterval(async function(){n++;await checkPerm();if(anyPerm()||n>40){clearInterval(iv);if(anyPerm())scanAll(true);else render();}},700);
}

/* ================= Vorschaubilder ================= */
var thumbs={},thQ=[],thRun=0;
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);queueThumb(e.target);}});},{rootMargin:'400px'}):null;
function hydrate(root){
  $$('img[data-th]:not([data-q])',root).forEach(function(im){im.setAttribute('data-q','1');if(io)io.observe(im);else queueThumb(im);});
  $$('img[data-src]:not([data-q])',root).forEach(function(im){im.setAttribute('data-q','1');im.onload=function(){im.classList.add('ok');};im.onerror=function(){im.remove();};im.src=im.getAttribute('data-src');});
  tmHydrate(root);
}
function okImg(im,src){if(im.getAttribute('data-tmset'))return;im.onload=function(){im.classList.add('ok');};im.onerror=function(){im.classList.remove('ok');};im.src=src;}
function queueThumb(im){var u=im.getAttribute('data-th');if(thumbs[u]){okImg(im,thumbs[u]);return;}if(thumbs[u]===0||!C)return;thQ.push(im);pumpThumbs();}
function pumpThumbs(){
  while(thRun<3&&thQ.length){
    var im=thQ.shift();thRun++;
    (async function(im){
      var u=im.getAttribute('data-th'),sq=im.hasAttribute('data-sq');
      try{if(!thumbs[u]){var r=await C.thumb({uri:u,w:sq?320:480,h:sq?320:270});thumbs[u]=Capacitor.convertFileSrc(r.path);}if(document.body.contains(im))okImg(im,thumbs[u]);}
      catch(e){thumbs[u]=0;}
      thRun--;pumpThumbs();
    })(im);
  }
}

var tmc=load('fc-tmdb',{}),tmQ=[],tmRun=0,tmT;
function tmKey(v){if(!v||!v.p)return '';return v.p.ep?'t:'+v.p.show.toLowerCase():'m:'+v.p.title.toLowerCase()+'|'+(v.p.year||'');}
function tmImg(info,big){if(!info)return '';if(big&&info.b)return 'https://image.tmdb.org/t/p/w1280'+info.b;return info.b?'https://image.tmdb.org/t/p/w780'+info.b:info.p?'https://image.tmdb.org/t/p/w500'+info.p:'';}
function tmHydrate(root){
  if(!set.tmdb)return;
  $$('[data-tm]:not([data-tq])',root).forEach(function(el){el.setAttribute('data-tq','1');var k=el.getAttribute('data-tm');if(tmc[k]!==undefined)tmApply(el,tmc[k]);else{tmQ.push(el);}});
  tmPump();
}
function tmApply(el,info){
  var src=tmImg(info,el.hasAttribute('data-big'));if(!src)return;
  el.setAttribute('data-tmset','1');el.onload=function(){el.classList.add('ok');};el.src=src;
}
function tmPump(){
  while(tmRun<3&&tmQ.length){
    var el=tmQ.shift(),k=el.getAttribute('data-tm');
    if(tmc[k]!==undefined){tmApply(el,tmc[k]);continue;}
    tmRun++;
    (async function(el,k){
      try{await tmFetch(k);}catch(e){}
      tmRun--;
      $$('[data-tm="'+CSS.escape(k)+'"]').forEach(function(x){if(tmc[k])tmApply(x,tmc[k]);});
      tmPump();
    })(el,k);
  }
}
function tmAuth(){return set.tmdb.length>60?{h:{Authorization:'Bearer '+set.tmdb},q:''}:{h:{},q:'&api_key='+encodeURIComponent(set.tmdb)};}
async function tmFetch(k){
  if(tmc[k]!==undefined||!set.tmdb)return tmc[k];
  var kind=k.charAt(0),rest=k.slice(2),q=rest.split('|')[0],y=rest.split('|')[1]||'',a=tmAuth();
  var url='https://api.themoviedb.org/3/search/'+(kind==='t'?'tv':'movie')+'?language=de-DE&include_adult=false&query='+encodeURIComponent(q)+(y?(kind==='t'?'&first_air_date_year=':'&year=')+y:'')+a.q;
  var j=await getJSON(url,a.h);
  var r=(j.results||[])[0];
  tmc[k]=r?{p:r.poster_path||'',b:r.backdrop_path||'',o:r.overview||'',r:Math.round((r.vote_average||0)*10)/10,t:r.title||r.name||'',y:(r.release_date||r.first_air_date||'').slice(0,4)}:0;
  clearTimeout(tmT);tmT=setTimeout(function(){save('fc-tmdb',tmc);},800);
  return tmc[k];
}

async function playVideos(items,idx,opt){
  opt=opt||{};
  if(!items.length)return;
  if(audioOn())au.pause();
  if(C){
    try{
      var r=await C.play({items:items,index:idx,headers:opt.headers||{},live:!!opt.live,engine:opt.engine||set.engine||'auto'});
      if(!opt.live&&r&&r.items)r.items.forEach(function(x,i){afterPlay(items[i],x.pos,x.dur,x.ended,opt);});
      if(opt.after)opt.after(r);
      render();
    }catch(e){toast('Abspielen fehlgeschlagen: '+errText(e));}
    return;
  }
  webPlayer(items,idx,opt);
}
function afterPlay(it,pos,dur,ended,opt){
  var k=it.key;if(!k)return;
  if(!dur&&!ended)return;
  if(ended||(dur&&pos>=dur*0.92)){watched[k]=1;delete resume[k];}
  else if(pos>Math.max(30000,dur*0.02)){resume[k]=Object.assign({},it.meta||{},{pos:pos,dur:dur,t:Date.now(),play:{url:it.url,title:it.title,subtitle:it.subtitle||'',sub:it.sub||'',type:it.type||'',headers:opt.headers||null}});}
  else return;
  save('fc-watched',watched);saveRes();
}
// Ersatz im Browser (nur zum Ausprobieren ohne App)
function webPlayer(items,idx,opt){

  var vd=$('video',vw);vd.src=fsrc(it.url);if(it.start)vd.currentTime=it.start/1000;

var AU_VLC=/\.(wma|ape|aiff?|mka|ac3|dts|wv|mpc|tta|amr|ra|alac)(\?|$)/i;
function startTrack(){
  var t=queue[qi];if(!t)return;

var tvCh={},tvSel=load('fc-tvsel',''),tvGrp=load('fc-tvgrp','*'),tvQ='',tvBusy=false;
function parseM3U(text){
  var out=[],cur=null,grp='';
  String(text||'').split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l)return;
    if(/^#EXTINF/i.test(l)){
      cur={};var q=false,cut=-1;
      for(var i=8;i<l.length;i++){var ch=l.charAt(i);if(ch==='"')q=!q;else if(ch===','&&!q){cut=i;break;}}
      var attrs=cut>0?l.slice(0,cut):l,re=/([\w-]+)="([^"]*)"/g,m;
      while((m=re.exec(attrs))){cur[m[1].toLowerCase()]=m[2];}
      cur.n=cut>0?l.slice(cut+1).trim():'';
      return;
    }
    if(/^#EXTGRP:/i.test(l)){grp=l.slice(8).trim();return;}
    if(/^#EXTVLCOPT:/i.test(l)){if(!cur)cur={};var o=l.slice(11),k=o.indexOf('=');if(k>0){var key=o.slice(0,k).toLowerCase(),val=o.slice(k+1);if(key==='http-user-agent')cur.ua=val;if(key==='http-referrer'||key==='http-referer')cur.ref=val;}return;}
    if(l.charAt(0)==='#')return;
    if(!/^(https?|rtmp|rtsp|udp|rtp):\/\//i.test(l)){cur=null;return;}
    cur=cur||{};
    out.push({n:cur.n||cur['tvg-name']||l.split('/').pop(),u:l,g:cur['group-title']||grp||'Ohne Gruppe',logo:cur['tvg-logo']||'',ua:cur.ua||'',ref:cur.ref||''});
    cur=null;grp='';
  });
  return out;
}
async function tvLoad(list,force){

  var h={};if(list.ua)h['User-Agent']=list.ua;
  var r=await req(list.url,{headers:h,timeout:40000});
  if(r.status>=400)throw new Error('Liste nicht erreichbar ('+r.status+')');
  var ch=parseM3U(r.text);

}

var EXT={video:/\.(mp4|m4v|mkv|avi|divx|xvid|mov|qt|webm|ts|m2ts|mts|wmv|asf|flv|f4v|mpe?g|mpe|m2v|m1v|3gp|3g2|vob|ogv|ogm|rm|rmvb|dv|mxf|amv)$/i,audio:/\.(mp3|flac|m4a|aac|ogg|oga|opus|wav|wma|alac|aiff?|ape|mka|ac3|dts|wv|mpc|tta|amr|ra)$/i,image:/\.(jpe?g|png|gif|webp|heic|bmp)$/i,sub:/\.(srt|vtt)$/i};
function kindOf(name,mime,cls){
  var s=String(cls||'')+' '+String(mime||'');
  if(/video/i.test(s))return 'video';if(/audio|music/i.test(s))return 'audio';if(/image|photo/i.test(s))return 'image';
  for(var k of ['video','audio','image','sub'])if(EXT[k].test(name||''))return k;
  return 'other';
}
function srcAuth(s){if(!s||!s.user)return {};return {Authorization:'Basic '+btoa(unescape(encodeURIComponent(s.user+':'+(s.pass||''))))};}
function xkid(el,name){if(!el)return null;for(var c=el.firstElementChild;c;c=c.nextElementSibling)if(c.localName===name)return c;return null;}
function xall(doc,name){var out=[],all=doc.getElementsByTagName('*');for(var i=0;i<all.length;i++)if(all[i].localName===name)out.push(all[i]);return out;}
function xesc(s){return String(s).replace(/[<>&'"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c];});}
function parseXml(t){return new DOMParser().parseFromString(t,'application/xml');}
async function dlnaInfo(loc){
  var r=await req(loc,{timeout:6000});var d=parseXml(r.text);
  var name=(xall(d,'friendlyName')[0]||{}).textContent||'Mediaserver';
  var base=((xall(d,'URLBase')[0]||{}).textContent||'').trim()||loc;
  var ctl='';
  xall(d,'service').forEach(function(s){var t=(xkid(s,'serviceType')||{}).textContent||'';if(/ContentDirectory/i.test(t)&&!ctl)ctl=new URL(((xkid(s,'controlURL')||{}).textContent||'').trim(),base).href;});
  return {name:name.trim(),ctl:ctl};
}
async function dlnaBrowse(src,id){
  if(!src.ctl){var inf=await dlnaInfo(src.url);if(!inf.ctl)throw new Error('Das Gerät bietet keine Medien an.');src.ctl=inf.ctl;save('fc-src',sources);}
  var out=[],start=0,total=1;
  while(start<total&&start<3000){
    var body='<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/" s:encodingStyle="http://schemas.xmlsoap.org/soap/encoding/"><s:Body><u:Browse xmlns:u="urn:schemas-upnp-org:service:ContentDirectory:1"><ObjectID>'+xesc(id)+'</ObjectID><BrowseFlag>BrowseDirectChildren</BrowseFlag><Filter>*</Filter><StartingIndex>'+start+'</StartingIndex><RequestedCount>400</RequestedCount><SortCriteria></SortCriteria></u:Browse></s:Body></s:Envelope>';
    var r=await req(src.ctl,{method:'POST',body:body,headers:{'Content-Type':'text/xml; charset="utf-8"','SOAPAction':'"urn:schemas-upnp-org:service:ContentDirectory:1#Browse"'},timeout:15000});
    if(r.status>=400)throw new Error('Mediaserver antwortet mit Fehler '+r.status);
    var d=parseXml(r.text),res=xall(d,'Result')[0];
    total=+((xall(d,'TotalMatches')[0]||{}).textContent||0);
    var n=+((xall(d,'NumberReturned')[0]||{}).textContent||0);
    var didl=parseXml((res&&res.textContent)||'<DIDL-Lite/>');
    var root=didl.documentElement;
    for(var el=root&&root.firstElementChild;el;el=el.nextElementSibling){
      var title=((xkid(el,'title')||{}).textContent||'').trim();
      if(el.localName==='container'){out.push({dir:true,id:el.getAttribute('id'),name:title,count:+(el.getAttribute('childCount')||0)});}
      else if(el.localName==='item'){
        var rs=xkid(el,'res');if(!rs)continue;
        var pi=(rs.getAttribute('protocolInfo')||'').split(':'),cls=((xkid(el,'class')||{}).textContent||'');
        var art=((xkid(el,'albumArtURI')||{}).textContent||'').trim();
        out.push({dir:false,name:title,url:rs.textContent.trim(),kind:kindOf(title,pi[2],cls),size:+(rs.getAttribute('size')||0),dur:rs.getAttribute('duration')||'',artist:((xkid(el,'artist')||xkid(el,'creator')||{}).textContent||''),album:((xkid(el,'album')||{}).textContent||''),img:art});
      }
    }
    if(!n)break;start+=n;
  }
  return out;

async function davList(src,url){
  var body='<?xml version="1.0" encoding="utf-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/><d:resourcetype/><d:getcontentlength/><d:getcontenttype/></d:prop></d:propfind>';
  var r=await req(url,{method:'PROPFIND',body:body,headers:Object.assign({'Depth':'1','Content-Type':'application/xml; charset=utf-8'},srcAuth(src))});
  if(r.status===401)throw new Error('Benutzername oder Passwort falsch.');

  xall(d,'response').forEach(function(rp){
    var href=((xkid(rp,'href')||{}).textContent||'').trim();if(!href)return;
    var u=new URL(href,url);if(decodeURIComponent(u.pathname.replace(/\/+$/,''))===decodeURIComponent(me))return;
    var col=xall(rp,'collection').length>0,name=decodeURIComponent(u.pathname.replace(/\/+$/,'').split('/').pop());
    var dn=xall(rp,'displayname')[0];if(dn&&dn.textContent.trim())name=dn.textContent.trim();
    var sz=xall(rp,'getcontentlength')[0],ct=xall(rp,'getcontenttype')[0];
    out.push({dir:col,name:name,url:u.href,kind:col?'':kindOf(name,ct&&ct.textContent),size:sz?+sz.textContent:0});
  });
  return out;
}
async function httpList(src,url){
  var r=await req(url,{headers:srcAuth(src)});
  if(r.status===401)throw new Error('Benutzername oder Passwort falsch.');
  if(r.status>=400)throw new Error('Fehler '+r.status);
  var d=new DOMParser().parseFromString(r.text,'text/html'),base=r.url||url,me=new URL(base),seen={},out=[];
  $$('a[href]',d).forEach(function(a){
    var h=a.getAttribute('href');if(!h||/^(\?|#|mailto:|javascript:)/i.test(h))return;
    var u;try{u=new URL(h,base);}catch(e){return;}
    if(u.host!==me.host||u.href===me.href||seen[u.href])return;
    if(me.pathname.indexOf(u.pathname)===0&&u.pathname.length<me.pathname.length)return; // Elternordner
    seen[u.href]=1;
    var dir=/\/$/.test(u.pathname),name=decodeURIComponent(u.pathname.replace(/\/+$/,'').split('/').pop());
    if(!name)return;
    out.push({dir:dir,name:name,url:u.href,kind:dir?'':kindOf(name)});
  });
  return out;
}

async function netList(src,node){

}

async function checkUpdate(manual){
  var Pu=plug('Updater');if(!Pu)return;
  await loadVer();
  if(REPO.indexOf('__')===0){if(manual)toast('Diese Version kennt ihr GitHub-Repository nicht.');return;}
  if(manual)toast('Suche nach Updates …');
  try{
    var r=await fetchT('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'}},12000);
    if(!r.ok)throw new Error('GitHub '+r.status);
    var j=await r.json(),m=String(j.tag_name||'').match(/(\d+)\s*$/),ver=m?parseInt(m[1],10):0;
    var asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name);})[0];
    if(!asset)throw new Error('keine APK im Release');
    if(appVer&&ver>appVer.code){
      upd={ver:ver,url:asset.browser_download_url,size:asset.size,done:false,notes:String(j.body||'').split(/\r?\n/).map(function(l){return l.replace(/^[\s*•-]+/,'').trim();}).filter(function(l){return l&&!/^(co-authored-by|claude-session)/i.test(l)&&!/^https?:/.test(l);})};
      updateSheet();
    }else if(manual)toast('Du hast die neueste Version ('+(appVer?appVer.code:'?')+').');
  }catch(e){if(manual)toast('Update-Prüfung fehlgeschlagen: '+errText(e).slice(0,100));}
}

function repoKind(r){return r.kind==='tv'?'Senderliste':r.kind==='fox'?'Fox-Repo':r.kind==='src'?'Ordner':'Repo';}
async function addRepo(url,name,old){
  url=String(url||'').trim();
  if(!/^https?:\/\//i.test(url)){toast('Bitte einen Link mit http:// oder https:// einfügen.');return;}
  if(!old&&repos.some(function(r){return r.url===url;})){toast('Dieses Repo ist schon drin.');return;}
  toast('Repo wird geladen …',15000);
  try{
    if(/\.zip(\?|$)/i.test(url))throw new Error('Das ist ein Kodi-Add-on oder -Repository. Kodi-Add-ons laufen nur in Kodi, nicht in Fox Center.');
    var r=await req(url,{timeout:40000}),t=r.text||'',lt=t.slice(0,4000).trim();
    if(r.status>=400)throw new Error('Link nicht erreichbar ('+r.status+')');
    if(/<addons?[\s>]/i.test(lt))throw new Error('Das ist ein Kodi-Repository. Kodi-Add-ons laufen nur in Kodi, nicht in Fox Center.');
    var rep=old||{id:'r'+Date.now(),url:url,name:name||'',kind:'',t:0,tv:[],src:[]};
    if(old)removeRepoItems(rep);
    rep.tv=[];rep.src=[];
    if(/#EXTM3U|#EXTINF/i.test(lt)){
      var ch=parseM3U(t);if(!ch.length)throw new Error('In der Liste wurden keine Sender gefunden.');
      var l={id:'t'+Date.now(),name:rep.name||decodeURIComponent(url.split('?')[0].split('/').pop().replace(/\.[^.]+$/,''))||'Senderliste',url:url,count:ch.length,t:Date.now(),repo:rep.id};
      tvLists.push(l);tvCh[l.id]=ch;await iset('tv-'+l.id,ch);save('fc-tv',tvLists);
      rep.kind='tv';rep.name=rep.name||l.name;rep.tv=[l.id];rep.info=ch.length+' Sender';
    }else if(/^[\[{]/.test(lt)){
      var j=JSON.parse(t),tvs=[].concat(j.tv||j.iptv||j.playlists||[]),srcs=[].concat(j.sources||j.quellen||[]);
      if(Array.isArray(j))j.forEach(function(x){if(x&&x.url){if(/m3u/i.test(x.url)||x.type==='tv')tvs.push(x);else srcs.push(x);}});
      if(!tvs.length&&!srcs.length)throw new Error('Im Repo stehen keine Senderlisten oder Quellen.');
      var nT=0,nS=0;
      for(var x of tvs){if(!x||!x.url)continue;try{var l2={id:'t'+Date.now()+nT,name:x.name||'Senderliste',url:x.url,ua:x.ua||x.userAgent||'',count:0,t:0,repo:rep.id};await tvLoad(l2,true);tvLists.push(l2);rep.tv.push(l2.id);nT++;}catch(e){}}
      srcs.forEach(function(x){if(!x||!x.url)return;var ty=/dlna|upnp/i.test(x.type||'')?'dlna':/dav/i.test(x.type||'')?'webdav':'http';var ns={id:'s'+Date.now()+nS,name:x.name||new URL(x.url).host,type:ty,url:x.url,user:x.user||'',pass:x.pass||'',repo:rep.id};sources.push(ns);rep.src.push(ns.id);nS++;});
      save('fc-tv',tvLists);save('fc-src',sources);
      if(!nT&&!nS)throw new Error('Die Listen im Repo ließen sich nicht laden.');
      rep.kind='fox';rep.name=rep.name||j.name||'Fox-Repo';rep.info=[nT?nT+' Senderliste'+(nT>1?'n':''):'',nS?nS+' Quelle'+(nS>1?'n':''):''].filter(Boolean).join(' · ');
    }else if(/<html|<a\s+href|multistatus/i.test(lt)){
      var ty2=/multistatus/i.test(lt)?'webdav':'http';
      var ns2={id:'s'+Date.now(),name:rep.name||new URL(url).host,type:ty2,url:url,repo:rep.id};
      var items=await netList(ns2,{});
      if(!items.length)throw new Error('In diesem Ordner liegen keine Dateien.');
      sources.push(ns2);save('fc-src',sources);rep.src=[ns2.id];rep.kind='src';rep.name=rep.name||ns2.name;rep.info=items.length+' Einträge';
    }else throw new Error('Mit diesem Link kann Fox Center nichts anfangen.');
    rep.t=Date.now();
    if(!old)repos.push(rep);
    saveRepos();toast(rep.name+' '+(old?'aktualisiert':'hinzugefügt')+' · '+rep.info,5000);
    reposSheet();render();
  }catch(e){toast(errText(e),7000);}
}
function removeRepoItems(r){
  (r.tv||[]).forEach(function(id){delete tvCh[id];idel('tv-'+id);});
  tvLists=tvLists.filter(function(l){return (r.tv||[]).indexOf(l.id)<0;});
  sources=sources.filter(function(s){return (r.src||[]).indexOf(s.id)<0;});
  if(tvSel&&!tvLists.some(function(l){return l.id===tvSel;})){tvSel='';save('fc-tvsel','');}
  save('fc-tv',tvLists);save('fc-src',sources);
}
function delRepo(id){var r=repos.filter(function(x){return x.id===id;})[0];if(!r)return;removeRepoItems(r);repos=repos.filter(function(x){return x.id!==id;});saveRepos();reposSheet();render();toast('Repo entfernt');}

    case 'tvre':render();break;

    case 'chfav':{var c=tvFiltered()[i];if(!c)break;var j=tvFav.indexOf(c.u);if(j>=0)tvFav.splice(j,1);else tvFav.push(c.u);save('fc-tvfav',tvFav);b.classList.toggle('on',j<0);if(tvGrp==='★'){tvShown=0;$('#tvlist').innerHTML='';tvMore();}break;}
    case 'favch':{var l=curTvList(),all=l?tvCh[l.id]||[]:[],fl=all.filter(function(c){return tvFav.indexOf(c.u)>=0;}),n=fl.findIndex(function(c){return c.u===u;});if(n>=0)playChannel(fl,n);break;}
    case 'lastch':{var ls=load('fc-tvlast',null),l2=curTvList();if(!ls||!l2)break;var ch=await tvLoad(l2).catch(function(){return [];}),n2=ch.findIndex(function(c){return c.u===ls.u;});if(n2>=0)playChannel(ch,n2);else playVideos([{url:ls.u,title:ls.n}],0,{live:true});break;}
    case 'tvref':{var lr=tvLists.filter(function(x){return x.id===k;})[0];if(!lr)break;toast('Wird aktualisiert …');try{await tvLoad(lr,true);toast(lr.count+' Sender');tvManageSheet();render();}catch(x){toast(errText(x));}break;}
    case 'tvdel':tvLists=tvLists.filter(function(x){return x.id!==k;});save('fc-tv',tvLists);delete tvCh[k];idel('tv-'+k);if(tvSel===k){tvSel='';save('fc-tvsel','');}closeSheet();render();break;
    // Netzwerk
    case 'addsrc':addSrcSheet();break;
    case 'ssdp':ssdpSearch();break;
    case 'adddlna':{var fd=($('#ssdpRes')._found||[])[i];if(!fd)break;sources.push({id:'s'+Date.now(),name:fd.name,type:'dlna',url:fd.url,ctl:fd.ctl});save('fc-src',sources);b.outerHTML='<span class="end ok2">'+ic('check')+'</span>';render();toast(fd.name+' hinzugefügt');break;}
    case 'stype':$$('[data-act="stype"]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});break;
    case 'savesrc':{var url=$('#sUrl').value.trim(),ty=($('[data-act="stype"][aria-pressed="true"]')||{}).dataset;ty=ty?ty.k:'webdav';
      if(!/^https?:\/\//i.test(url)){toast('Bitte eine Adresse mit http:// oder https:// eingeben.');break;}
      var ns={id:'s'+Date.now(),name:$('#sName').value.trim()||new URL(url).host,type:ty,url:url,user:$('#sUser').value.trim(),pass:$('#sPass').value};
      toast('Wird geprüft …');
      try{await netList(ns,{});sources.push(ns);save('fc-src',sources);closeSheet();vchip='net';save('fc-vchip','net');go('video');toast(ns.name+' hinzugefügt');}
      catch(x){toast('Ging nicht: '+errText(x),6000);}
      break;}
    case 'delsrc':sources=sources.filter(function(x){return x.id!==k;});save('fc-src',sources);render();break;
    case 'opensrc':push({p:'net',sid:k,path:[]});break;
    case 'netre':{var pn=nav[nav.length-1];if(pn&&pn.p==='net'){var s2=sources.filter(function(x){return x.id===pn.sid;})[0];var nd=pn.path[pn.path.length-1]||{};if(s2)delete netCache[s2.id+'|'+(nd.id||nd.url||'')];pn.items=null;pn.err='';render();}break;}
    case 'netitem':{var pn2=nav[nav.length-1],it=netItems[i];if(!it||!pn2)break;
      if(it.dir){push({p:'net',sid:pn2.sid,path:pn2.path.concat([{id:it.id,url:it.url,name:it.name}])});}else netPlayItem(it,pn2);break;}
    case 'netall':{var pn3=nav[nav.length-1],first=netItems.filter(function(x){return x.kind===k;})[0];if(first&&pn3)netPlayItem(first,pn3);break;}
    // Suche
    case 'shit':{var x=sHits[i];if(!x)break;closeSheet();
      if(x.t==='vid')vidSheet(x.v);else if(x.t==='show'){tab='video';setNav();nav=[{p:'show',k:x.k}];render();}
      else if(x.t==='album'){tab='music';setNav();nav=[{p:'album',k:x.k}];render();}
      else if(x.t==='song')playQueue([x.x],0);
      else if(x.t==='ch')playChannel([x.c],0);
      break;}
    // Einstellungen
    case 'theme':set.theme=k;saveSet();settingsSheet();break;
    case 'engine':set.engine=k;saveSet();settingsSheet();break;
    case 'minmov':set.minMovie=+k;saveSet();processLib();render();settingsSheet();break;
    case 'tmsave':set.tmdb=$('#tmk').value.trim();saveSet();if(set.tmdb){try{await getJSON('https://api.themoviedb.org/3/configuration?x=1'+tmAuth().q,tmAuth().h);toast('TMDb-Schlüssel funktioniert.');}catch(x){toast('Schlüssel geht nicht: '+errText(x));}}render();break;
    case 'deepon':deepOn();break;
    case 'deepgo':closeSheet();deepWait=true;try{await C.askAllFiles();}catch(x){toast(errText(x));}break;
    case 'rpaste':try{var ct=await navigator.clipboard.readText();if(ct)$('#rUrl').value=ct.trim();}catch(x){toast('Zwischenablage geht hier nicht – halte im Feld gedrückt und wähle Einfügen.');}break;
    case 'repos':reposSheet();break;
    case 'repoadd':addRepo($('#rUrl').value,$('#rName').value.trim());break;
    case 'reporef':{var rr=repos.filter(function(x){return x.id===k;})[0];if(rr)addRepo(rr.url,rr.name,rr);break;}
    case 'repodel':delRepo(k);break;
    case 'rescan':closeSheet();if(!C)toast('Nur in der App.');else scanAll(false);break;
    case 'clrres':resume={};saveRes();closeSheet();render();toast('Geleert');break;
    case 'upd':closeSheet();checkUpdate(true);break;
    case 'updgo':doUpdate();break;
  }
});

/* ================= Zurück-Taste ================= */
window.foxBack=function(){
  if(viewer){closeViewer();return true;}
  if($('#sheet').classList.contains('open')){closeSheet();return true;}
  if(nav.length){nav.pop();render();return true;}
  if(tab!=='home'){go('home');return true;}
  return false;
};

/* ================= Fernbedienung: Pfeiltasten bewegen den Fokus ================= */
function focusables(){
  var scope=viewer?$('#viewer'):$('#sheet').classList.contains('open')?$('#sheet'):document;
  return $$('button,input,select,textarea,label.btn,[tabindex]:not([tabindex="-1"])',scope).filter(function(el){
    if(el.disabled||el.closest('[hidden]'))return false;
    if(scope===document&&el.closest('#sheet,#viewer'))return false;
    var r=el.getBoundingClientRect();return r.width>0&&r.height>0;
  });
}
function moveFocus(dir){
  var cur=document.activeElement,all=focusables();
  if(!cur||cur===document.body||all.indexOf(cur)<0){var vis=all.filter(function(el){var r=el.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight;});var f=vis.filter(function(el){return el.closest('#main');})[0]||vis[0]||all[0];if(f)f.focus();return;}
  var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,bs=1e9;
  all.forEach(function(el){
    if(el===cur)return;var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dx=x-ax,dy=y-ay,main,side;
    if(dir==='left'){if(r.right>a.left+4)return;main=-dx;side=Math.abs(dy);}
    else if(dir==='right'){if(r.left<a.right-4)return;main=dx;side=Math.abs(dy);}
    else if(dir==='up'){if(r.bottom>a.top+4)return;main=-dy;side=Math.abs(dx);}
    else{if(r.top<a.bottom-4)return;main=dy;side=Math.abs(dx);}
    var sc=main+side*2.2;if(sc<bs){bs=sc;best=el;}
  });
  if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});}
}
document.addEventListener('keydown',function(e){
  var map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'},d=map[e.key],t=e.target;
  if(e.key==='Escape'||e.key==='BrowserBack'||e.key==='GoBack'){if(foxBack())e.preventDefault();return;}
  if(viewer&&!viewer.web&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!(t&&t.closest&&t.closest('.vt'))){vStep(e.key==='ArrowLeft'?-1:1);e.preventDefault();return;}
  if(e.key==='MediaPlayPause'&&queue.length){if(au.paused)au.play();else au.pause();return;}
  if(e.key==='MediaTrackNext'&&queue.length){nextTrack(false);return;}
  if(e.key==='MediaTrackPrevious'&&queue.length){prevTrack();return;}
  if(!d)return;
  if(t&&t.tagName==='INPUT'&&(t.type==='text'||t.type==='password')&&(d==='left'||d==='right'))return;
  if(t&&t.type==='range'&&(d==='left'||d==='right'))return;
  document.body.classList.add('kb');
  e.preventDefault();moveFocus(d);
});
document.addEventListener('pointerdown',function(){document.body.classList.remove('kb');});
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var t=e.target;if(t&&t.id==='tUrl'){e.preventDefault();addTvList(t.value,$('#tName').value.trim(),$('#tUa').value.trim());}}});

/* ================= Uhr und Start ================= */
function tick(){var d=new Date(),c=$('#clock');c.innerHTML='<b>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</b><small>'+d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})+'</small>';}
tick();setInterval(tick,15000);
setNav();
(async function(){
  await loadLibCache();
  await checkPerm();if(set.deep)await checkDeep();
  render();
  setTimeout(function(){$('#splash').classList.add('hide');},700);
  if(C&&(anyPerm()||(set.deep&&deepOk)))scanAll(true);
  var l=curTvList();if(l&&!tvCh[l.id])iget('tv-'+l.id).then(function(c){if(Array.isArray(c)){tvCh[l.id]=c;if(tab==='home')render();}});
})();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&C){var had=anyPerm();checkPerm().then(function(){if(!had&&anyPerm())scanAll(true);});
  if(deepWait){checkDeep().then(function(ok){if(ok){deepWait=false;set.deep=true;saveSet();toast('Danke! Fox Center durchsucht jetzt dein ganzes Handy …',5000);scanAll(false);}});}}});
if(isNative()&&set.autoUpd){
  var lastU=0;try{lastU=Number(localStorage.getItem('fc-upd-t')||0);}catch(e){}
  if(Date.now()-lastU>6*3600e3){try{localStorage.setItem('fc-upd-t',String(Date.now()));}catch(e){}setTimeout(function(){checkUpdate(false);},3500);}
}
